name: renovate

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: only process this repo
        type: choice
        default: all
        options: [all, xenondevs/renovate, xenondevs/tessera]

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3.3.0
        id: token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: xenondevs
          repositories: |
            renovate
            tessera

      - name: Limit to one repo
        if: ${{ inputs.repo && inputs.repo != 'all' }}
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
        run: echo "RENOVATE_REPOSITORIES=$REPO" >> "$GITHUB_ENV"

      - uses: renovatebot/github-action@v46.3.13
        with:
          configurationFile: config.js
          token: ${{ steps.token.outputs.token }}
          renovate-image: renovate/renovate:44.210.0@sha256:59ee9d519b9fec428243f3b73f7fecebac59756888ce1838196bb5d40efe3559

  # diff. job to prevent untrusted code from having any tokens in its env
  discover:
    needs: renovate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: xenondevs/actions/setup-nu@v1
        with:
          version: 0.116.1
          sha256: d6d8ace4be491ed8abba4026e73b60c0470b4671d7039307e7d772282ef863da

      - id: list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.repo }}
        run: nu .github/scripts/discover.nu .github/regenerate.json "$ONLY" >> "$GITHUB_OUTPUT"

  regenerate:
    needs: discover
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.branches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.branches) }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-disabled: true
          validate-wrappers: true

      # renovate doesn't update the hash
      - name: Wrapper hash
        shell: bash
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's/\\:/:/')
          if grep -q '^distributionSha256Sum=' "$props"; then
            sed -i "s/^distributionSha256Sum=.*/distributionSha256Sum=$(curl -fsSL "$url.sha256")/" "$props"
          fi

      - name: Regenerate
        shell: bash
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          # drop every pinned entry so versions that are no longer used disappear
          sed -i '/<components>/,/<\/components>/{//!d}' gradle/verification-metadata.xml
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache --no-build-cache $TASKS

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: regenerated-${{ strategy.job-index }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error

  validate:
    needs: [discover, regenerate]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.branches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.branches) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@v8.0.2
        with:
          name: regenerated-${{ strategy.job-index }}
          path: regenerated

      - uses: xenondevs/actions/setup-nu@v1
        with:
          version: 0.116.1
          sha256: d6d8ace4be491ed8abba4026e73b60c0470b4671d7039307e7d772282ef863da

      - name: Validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          BRANCH: ${{ matrix.branch }}
          SHA: ${{ matrix.sha }}
        run: nu .github/scripts/validate.nu "$REPO" "$BRANCH" "$SHA" regenerated/verification-metadata.xml payload.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: commit-${{ strategy.job-index }}
          path: payload.json
          if-no-files-found: error

  commit:
    needs: [discover, validate]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.branches != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.branches) }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: commit-${{ strategy.job-index }}

      - uses: actions/create-github-app-token@v3.3.0
        id: token
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: xenondevs
          repositories: ${{ matrix.name }}
          permission-contents: write

      - name: Commit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if [ "$(jq 'has("query")' payload.json)" != true ]; then
            echo "nothing to commit"
            exit 0
          fi
          gh api graphql --input payload.json --jq '.data.createCommitOnBranch.commit.oid'
